version: "2"
overrides:
  go:
    overrides:
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: date
        go_type: time.Time
      - db_type: date
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: text
        nullable: true
        go_type:
          type: string
          pointer: true
      - db_type: pg_catalog.int8
        nullable: true
        go_type:
          type: int64
          pointer: true
      - db_type: bool
        nullable: true
        go_type:
          type: bool
          pointer: true
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/queries
    gen:
      go:
        package: db
        out: internal/db
        sql_package: pgx/v5
        emit_empty_slices: true
