services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: quickstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      QUICKSTACK_OWNER_PASSWORD: ${QUICKSTACK_OWNER_PASSWORD:-owner}
      QUICKSTACK_APP_PASSWORD: ${QUICKSTACK_APP_PASSWORD:-app}
    volumes:
      - db:/var/lib/postgresql
      - ./internal/db/roles.sql:/quickstack/roles.sql:ro
      - ./deploy/initdb.sh:/docker-entrypoint-initdb.d/10-quickstack.sh:ro
    ports:
      - "127.0.0.1:${QUICKSTACK_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "quickstack"]
      interval: 2s
      retries: 30

  # S3-compatible storage for trying the s3:// blob store; `make s3-up`.
  s3:
    image: chrislusf/seaweedfs:4.50
    profiles: [s3]
    command: server -s3 -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=128
    environment:
      AWS_ACCESS_KEY_ID: ${QUICKSTACK_S3_KEY:-quickstack}
      AWS_SECRET_ACCESS_KEY: ${QUICKSTACK_S3_SECRET:-quickstack-secret}
    volumes:
      - s3:/data
    ports:
      - "127.0.0.1:${QUICKSTACK_S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 30

volumes:
  db:
  s3:
